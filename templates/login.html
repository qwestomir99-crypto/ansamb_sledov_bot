<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Ансамбль Следов 6</title>
    <!-- Favicon: частота сети 0,8 Гц -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='10' y='65' font-family='monospace' font-size='50' fill='%2300ffcc'%3E0.8%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, 'Inter', 'SF Pro Text', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        
        h2 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #1d1d1f;
            margin-bottom: 0.25rem;
        }
        
        .subtitle {
            color: #86868b;
            font-size: 0.85rem;
        }
        
        .input-group {
            margin-bottom: 1.25rem;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-family: inherit;
            transition: all 0.2s ease;
            background: white;
        }
        
        input:focus {
            outline: none;
            border-color: #007aff;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }
        
        button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 500;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        
        button:hover {
            background: #005fc5;
            transform: scale(0.98);
        }
        
        .error-message {
            margin-top: 1rem;
            padding: 10px;
            background: #ffe5e5;
            border-left: 3px solid #ff3b30;
            color: #ff3b30;
            font-size: 0.85rem;
            border-radius: 8px;
            text-align: center;
        }
        
        .footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: #86868b;
            border-top: 1px solid #e5e5e7;
            padding-top: 1rem;
        }
        
        .footer a {
            color: #007aff;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🔥👁️</div>
            <h2>Ансамбль Следов 6</h2>
            <div class="subtitle">Вход в веб-морду</div>
        </div>
        
        <form method="post">
            <div class="input-group">
                <input type="password" name="password" placeholder="Админ-пароль" autofocus required>
            </div>
            <button type="submit">Войти</button>
            
            {% if error %}
                <div class="error-message">
                    ❌ {{ error }}
                </div>
            {% endif %}
        </form>
        
        <div class="footer">
            <p>Ритм 0,8 Гц. Сеть тлеет.</p>
            <p><a href="https://t.me/sapery_autentichnosti" target="_blank">🛡️ Сапёры Аутентичности</a></p>
        </div>
    </div>
</body>
</html>
