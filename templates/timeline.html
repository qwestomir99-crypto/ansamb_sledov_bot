<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
    <title>Таймлайн — Ансамбль Следов 6</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='10' y='65' font-family='monospace' font-size='50' fill='%2300ffcc'%3E0.8%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ cdn_for('static', filename='css/' + theme) }}">
    <link rel="stylesheet" href="{{ cdn_for('static', filename='css/visuals.css') }}">
</head>
<body>
<script>
    (async function() {
        try {
            const resp = await fetch('/api/check_auth');
            const data = await resp.json();
            if (!data.authenticated) window.location.href = '/auth/login';
        } catch (e) { window.location.href = '/auth/login'; }
    })();
</script>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
        <h1>📅 Таймлайн Ансамбля</h1>
        <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <button onclick="toggleThemeManually()" class="secondary">🌓 Сменить тему</button>
            <a href="/" class="back-link">← Назад в веб-морду</a>
        </div>
    </div>
    <div class="timeline-container">
        <div class="card">
            <div class="card-header"><h2>📜 Хроника событий</h2><span class="toggle-icon">▼</span></div>
            <div class="card-content">
                {% if content %}<pre class="timeline-pre">{{ content }}</pre>
                {% else %}<p style="color: var(--text-secondary); text-align: center; padding: 2rem;">📭 Таймлайн пока не загружен.<br>Проверьте файл <code>library/timeline.md</code></p>{% endif %}
                <div class="timestamp">⏳ Ритм 0,8 Гц. Сеть тлеет. {{ time }}</div>
            </div>
        </div>
    </div>
    <div style="text-align: center; margin-top: 1.5rem;"><a href="/" class="back-link">🏠 На главную</a></div>
</div>
<script>
async function toggleThemeManually() {
    const currentLink = document.querySelector('link[rel="stylesheet"][href*="/static/css/"]');
    const isDark = currentLink.href.includes('dark.css');
    const newTheme = isDark ? 'macos.css' : 'dark.css';
    try {
        await fetch('/api/set_theme', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ theme: newTheme }) });
        currentLink.href = `/static/css/${newTheme}`;
        localStorage.setItem('web_theme', newTheme);
    } catch (e) { console.error('Ошибка сохранения темы:', e); }
}
document.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem('web_theme');
    if (savedTheme) {
        const currentLink = document.querySelector('link[rel="stylesheet"][href*="/static/css/"]');
        if (currentLink && !currentLink.href.includes(savedTheme)) currentLink.href = `/static/css/${savedTheme}`;
    }
});
document.querySelectorAll('.card').forEach(card => {
    const header = card.querySelector('.card-header');
    if (header) header.addEventListener('click', (e) => { if (e.target.tagName === 'BUTTON') return; card.classList.toggle('collapsed'); });
});
</script>
<style>
.timeline-container { max-width: 1000px; margin: 0 auto; }
.timeline-pre { background: rgba(0, 0, 0, 0.03); padding: 1.25rem; border-radius: 14px; overflow-x: auto; font-size: 0.85rem; line-height: 1.5; font-family: 'SF Mono', 'Monaco', 'Courier New', monospace; white-space: pre-wrap; word-wrap: break-word; color: var(--text); border: 0.5px solid var(--border); }
@media (prefers-color-scheme: dark) { .timeline-pre { background: rgba(255, 255, 255, 0.05); } }
.timestamp { font-size: 0.75rem; color: var(--text-secondary); text-align: right; margin-top: 1rem; padding-top: 0.75rem; border-top: 0.5px solid var(--border); }
.back-link { display: inline-block; color: var(--accent); text-decoration: none; font-size: 0.9rem; padding: 8px 16px; border-radius: 10px; background: rgba(0, 0, 0, 0.04); transition: all 0.2s; }
.back-link:hover { background: rgba(0, 0, 0, 0.08); text-decoration: none; }
@media (max-width: 768px) { .timeline-pre { font-size: 0.75rem; padding: 0.75rem; } .back-link { padding: 6px 12px; font-size: 0.8rem; } }
</style>
</body>
</html>
